repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: isort
        name: isort
        language: system
        types: [ python ]
        entry: .venv/Scripts/isort.exe
      - id: black
        name: black
        language: system
        types: [ python ]
        entry: .venv/Scripts/black.exe

      - id: ruff
        name: ruff
        language: system
        types: [python]
        entry: .venv/Scripts/ruff.exe check --fix
